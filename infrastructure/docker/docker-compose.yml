services:
  postgres:
    image: postgres:16-alpine
    container_name: smritix-postgres
    environment:
      POSTGRES_USER: smritix
      POSTGRES_PASSWORD: smritix
      POSTGRES_DB: smritix
    ports:
      - "5432:5432"
    volumes:
      - smritix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smritix"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smritix-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - smritix_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smritix-redis
    ports:
      - "6379:6379"
    volumes:
      - smritix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smritix_postgres_data:
  smritix_qdrant_data:
  smritix_redis_data:
